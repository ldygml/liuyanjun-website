<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蛛丝打怪兽 · 999gml</title>
  <meta name="theme-color" content="#0d1524" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23e23636'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: #0d1524; color: #e8e6e0; }
    .game-page { display: flex; justify-content: center; padding: 88px 16px 60px; }
    .game-wrap { position: relative; width: min(800px, 100%); }
    canvas#game {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      touch-action: none;
      background: #0d1524;
    }
    .game-ui {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(10, 14, 22, 0.78);
      border-radius: 16px;
      gap: 14px;
      padding: 22px;
    }
    .game-ui.hidden { display: none; }
    .game-title { font-size: 2.3rem; font-weight: 800; margin: 0; }
    .game-desc { font-size: 0.95rem; color: #c6cdd8; margin: 0; line-height: 1.9; }
    .game-desc b { color: #fff; }
    .mode-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .ult-btn {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 5;
      border: none;
      background: linear-gradient(135deg, #e23636, #7c2d2d);
      color: #fff;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(226, 54, 54, 0.4);
      transition: transform 0.2s var(--ease);
    }
    .ult-btn:hover { transform: translateY(-2px) scale(1.04); }
    .ult-btn.hidden { display: none; }
    .ult-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>
  <header class="site-header scrolled">
    <div class="container nav-wrap">
      <a href="index.html" class="logo"><span id="logo-text">999gml</span><span class="logo-dot">.</span></a>
      <a href="index.html" class="btn btn-ghost" style="padding:8px 16px;">← 返回网站</a>
    </div>
  </header>

  <main class="game-page">
    <div class="game-wrap">
      <canvas id="game" width="800" height="1000"></canvas>
      <div class="game-ui" id="gameUi">
        <div class="game-title">🕷️ 蛛丝打怪兽</div>
        <p class="game-desc" id="gameDesc">
          移动：W A S D 或方向键（手机：手指拖动）<br />
          射击：<b>自动发射</b>，拾取 🕸️ 可增加蛛丝数量（最多 5 发）<br />
          道具：❤️ 加血（不封顶）· 🛡️ 护盾（最多 2 层，抵挡漏怪）<br />
          ⚡ 大招：按 <b>E</b> 或点右下角按钮（全屏蛛丝包裹所有怪物）<br />
          每得 60 分攒一个能量 ⚡（最多 2 个）
        </p>
        <div class="mode-row">
          <button class="btn btn-primary" id="btnLevel">🎯 关卡模式</button>
          <button class="btn btn-ghost" id="btnInfinite">♾️ 无限模式</button>
        </div>
      </div>
      <button class="ult-btn hidden" id="ultBtn">⚡ 大招</button>
    </div>
  </main>

  <script src="js/content.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
