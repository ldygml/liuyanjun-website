<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蛛丝矿工 · 999gml</title>
  <meta name="theme-color" content="#241a10" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23e23636'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: #241a10; color: #e8e6e0; }
    .game-page { display: flex; justify-content: center; padding: 88px 16px 60px; }
    .game-wrap { position: relative; width: min(560px, 100%); }
    canvas#game {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      touch-action: none;
      background: #241a10;
    }
    .game-ui {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(20, 14, 8, 0.8);
      border-radius: 16px;
      gap: 14px;
      padding: 22px;
    }
    .game-ui.hidden { display: none; }
    .game-title { font-size: 2.2rem; font-weight: 800; margin: 0; }
    .game-desc { font-size: 0.95rem; color: #d8cfc2; margin: 0; line-height: 1.9; }
    .game-desc b { color: #fff; }
  </style>
</head>
<body>
  <header class="site-header scrolled">
    <div class="container nav-wrap">
      <a href="index.html" class="logo"><span id="logo-text">999gml</span><span class="logo-dot">.</span></a>
      <div style="display:flex;gap:10px;">
        <a href="games.html" class="btn btn-ghost" style="padding:8px 14px;">🎮 游戏大厅</a>
        <a href="index.html" class="btn btn-ghost" style="padding:8px 14px;">← 返回网站</a>
      </div>
    </div>
  </header>

  <main class="game-page">
    <div class="game-wrap">
      <canvas id="game" width="560" height="700"></canvas>
      <div class="game-ui" id="gameUi">
        <div class="game-title">🕷️ 蛛丝矿工</div>
        <p class="game-desc" id="gameDesc">
          蜘蛛侠版黄金矿工！蛛丝会自动摆动，<b>按空格 / 点击</b>发射<br />
          抓住 🪙💰💎 得分，避开 🪨（太重）和 💣（扣 50 分）<br />
          90 秒内赚够目标分过关，共 3 关
        </p>
        <button class="btn btn-primary" id="startBtn">开始游戏</button>
      </div>
    </div>
  </main>

  <script src="js/content.js"></script>
  <script src="js/spidey-miner.js"></script>
</body>
</html>
